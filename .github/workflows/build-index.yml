name: Build recipe index

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**.json'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild manifest
        run: |
          cd recipes
          ls -1 *.json | grep -vx 'index.json' | sort \
            | jq -R -s 'split("\n") | map(select(length > 0))' > index.json

      - name: Commit if changed
        run: |
          if ! git diff --quiet recipes/index.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add recipes/index.json
            git commit -m "Rebuild recipe index"
            git push
          fi
